<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .drag-active {
            border-color: #3B82F6 !important;
            background-color: #EFF6FF !important;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .upload-progress {
            animation: progress 2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl">
        <div id="upload-container" class="bg-white rounded-lg shadow-lg p-8">
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer transition-all hover:border-blue-500 hover:bg-blue-50">
                <i class="bi bi-cloud-upload text-5xl text-gray-400 mb-4 block"></i>
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Drop your files here</h3>
                <p class="text-gray-500 mb-4">or</p>
                <button id="browse-btn" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    Browse Files
                </button>
                <input type="file" id="file-input" class="hidden" multiple>
                <p class="text-sm text-gray-400 mt-4">Maximum file size: 10MB</p>
            </div>

            <div id="upload-list" class="mt-6 space-y-4"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const browseBtn = document.getElementById('browse-btn');
        const uploadList = document.getElementById('upload-list');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone when dragging over it
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('drag-active');
        }

        function unhighlight(e) {
            dropZone.classList.remove('drag-active');
        }

        // Handle dropped files
        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);
        browseBtn.addEventListener('click', () => fileInput.click());

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files } });
        }

        function handleFiles(e) {
            const files = [...e.target.files];
            files.forEach(uploadFile);
        }

        function uploadFile(file) {
            validateFile(file);
            
            // Create upload item UI
            const uploadItem = document.createElement('div');
            uploadItem.className = 'bg-gray-50 rounded-lg p-4 flex items-center gap-4';
            
            const fileIcon = document.createElement('i');
            fileIcon.className = 'bi bi-file-earmark text-2xl text-gray-400';
            
            const fileInfo = document.createElement('div');
            fileInfo.className = 'flex-1';
            
            const fileName = document.createElement('p');
            fileName.className = 'text-sm font-medium text-gray-700';
            fileName.textContent = file.name;
            
            const progressContainer = document.createElement('div');
            progressContainer.className = 'w-full h-1.5 bg-gray-200 rounded-full mt-2';
            
            const progressBar = document.createElement('div');
            progressBar.className = 'h-full bg-blue-500 rounded-full upload-progress';
            
            progressContainer.appendChild(progressBar);
            fileInfo.appendChild(fileName);
            fileInfo.appendChild(progressContainer);
            
            uploadItem.appendChild(fileIcon);
            uploadItem.appendChild(fileInfo);
            
            uploadList.appendChild(uploadItem);

            // Simulate upload process
            setTimeout(() => {
                uploadItem.innerHTML += `
                    <i class="bi bi-check-circle-fill text-green-500 text-xl"></i>
                `;
            }, 2000);
        }

        function validateFile(file) {
            // File size validation (10MB limit)
            const maxSize = 10 * 1024 * 1024; // 10MB in bytes
            if (file.size > maxSize) {
                alert(`File ${file.name} is too large. Maximum size is 10MB.`);
                throw new Error('File too large');
            }
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
